app:
  name: ${BLINK_SERVER_NAME:-Blink}
  mode: ${BLINK_SERVER_MODE:-prod}
  port: ${BLINK_SERVER_PORT:-8000}
  url: ${BLINK_SERVER_URL:-http://127.0.0.1:8000}
  timeout: ${BLINK_SERVER_TIMEOUT:-50}
  # Comma-separated CIDRs of reverse proxies allowed to set X-Forwarded-For; empty means use the TCP peer
  trusted_proxies: ${BLINK_TRUSTED_PROXIES:-}

  encryption:
    key: ${BLINK_ENCRYPTION_KEY:-}

  metrics:
    username: ${BLINK_SERVER_PROM_METRICS_USERNAME:-admin}
    secret: ${BLINK_SERVER_PROM_METRICS_SECRET:-secret}

  log:
    level: ${BLINK_SERVER_LOG_LEVEL:-debug}
    output: ${BLINK_SERVER_LOG_OUTPUT:-stdout}
    format: ${BLINK_SERVER_LOG_FORMAT:-json}

  mailer:
    provider: ${BLINK_MAILER_PROVIDER:-resend}
    from: ${BLINK_MAILER_FROM:-no_reply@clivern.com}
    resend:
      api_key: ${BLINK_RESEND_API_KEY:-}

  oauth:
    github:
      client_id: ${BLINK_GITHUB_OAUTH_CLIENT_ID:-}
      client_secret: ${BLINK_GITHUB_OAUTH_CLIENT_SECRET:-}
      redirect_url: ${BLINK_GITHUB_OAUTH_REDIRECT_URL:-}
    google:
      client_id: ${BLINK_GOOGLE_OAUTH_CLIENT_ID:-}
      client_secret: ${BLINK_GOOGLE_OAUTH_CLIENT_SECRET:-}
      redirect_url: ${BLINK_GOOGLE_OAUTH_REDIRECT_URL:-}
    facebook:
      client_id: ${BLINK_FACEBOOK_OAUTH_CLIENT_ID:-}
      client_secret: ${BLINK_FACEBOOK_OAUTH_CLIENT_SECRET:-}
      redirect_url: ${BLINK_FACEBOOK_OAUTH_REDIRECT_URL:-}

  database:
    rw:
      driver: ${BLINK_DATABASE_DRIVER:-postgres}
      host: ${BLINK_DATABASE_HOST:-localhost}
      port: ${BLINK_DATABASE_PORT:-5433}
      username: ${BLINK_DATABASE_USERNAME:-postgres}
      password: ${BLINK_DATABASE_PASSWORD:-postgres}
      name: ${BLINK_DATABASE_NAME:-blink}
      max_open_conns: ${BLINK_DATABASE_MAX_OPEN_CONNS:-25}
      max_idle_conns: ${BLINK_DATABASE_MAX_IDLE_CONNS:-10}
      conn_max_lifetime: ${BLINK_DATABASE_CONN_MAX_LIFETIME:-300}
    ro:
    - driver: ${BLINK_DATABASE_DRIVER:-postgres}
      host: ${BLINK_DATABASE_HOST:-localhost}
      port: ${BLINK_DATABASE_PORT:-5433}
      username: ${BLINK_DATABASE_USERNAME:-postgres}
      password: ${BLINK_DATABASE_PASSWORD:-postgres}
      name: ${BLINK_DATABASE_NAME:-blink}
      max_open_conns: ${BLINK_DATABASE_MAX_OPEN_CONNS:-25}
      max_idle_conns: ${BLINK_DATABASE_MAX_IDLE_CONNS:-10}
      conn_max_lifetime: ${BLINK_DATABASE_CONN_MAX_LIFETIME:-300}

  ai:
    # openrouter
    provider: ${BLINK_AI_PROVIDER:-openrouter}
    api_key: ${BLINK_AI_API_KEY:-}
    chat_model: ${BLINK_AI_CHAT_MODEL:-openai/gpt-4o}
  cache:
    provider: ${BLINK_CACHE_PROVIDER:-redis}
    redis:
      addr: ${BLINK_REDIS_ADDR:-127.0.0.1:6379}
      password: ${BLINK_REDIS_PASSWORD:-}
      db: ${BLINK_REDIS_DB:-0}
      pool_size: ${BLINK_REDIS_POOL_SIZE:-10}
      min_idle_conns: ${BLINK_REDIS_MIN_IDLE_CONNS:-5}

  broker:
    provider: ${BLINK_BROKER_PROVIDER:-nats}
    nats:
      url: ${BLINK_BROKER_URL:-nats://127.0.0.1:4222}
      name: ${BLINK_BROKER_NAME:-blink}
      queue: ${BLINK_BROKER_QUEUE:-blink}
