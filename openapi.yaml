openapi: 3.0.3
info:
  title: Blink API
  description: |
    Blink is a multi-tenant workspace platform with members, access keys, key-value config and an AI chat assistant.

    **Authentication**: session cookie `_blink_session` or user API key `X-API-Key`. Workspace access keys `X-Access-Key`

    Errors are returned as `{"errorMessage": "..."}`.
  version: 1.0.0
  license:
    name: Proprietary

servers:
  - url: /
    description: App URL

tags:
  - name: Public
  - name: Session
  - name: Profile
  - name: Settings
  - name: API keys
  - name: Workspaces
  - name: Invites
  - name: Members
  - name: Access keys
  - name: Billing
  - name: Key-value
  - name: Chats
  - name: Metrics

security:
  - sessionCookie: []
  - userApiKey: []

paths:
  /api/v1/public/_health:
    get:
      tags: [Public]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"

  /api/v1/public/_ready:
    get:
      tags: [Public]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"

  /api/v1/public/action/setup:
    post:
      tags: [Public]
      summary: Initial platform setup
      description: Rate limited to 5 requests a minute per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: Setup completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/public/action/setup/status:
    get:
      tags: [Public]
      summary: Setup completion status
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed:
                    type: boolean
                  edition:
                    type: string

  /api/v1/public/action/logout:
    post:
      tags: [Public]
      summary: Clear session cookie
      security: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /api/v1/public/action/oauth/github:
    get:
      tags: [Public]
      summary: Start GitHub OAuth
      security: []
      responses:
        "302":
          description: Redirect to GitHub

  /api/v1/public/action/oauth/github/callback:
    get:
      tags: [Public]
      summary: GitHub OAuth callback
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from GitHub
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: Must match the state cookie set when the flow started
      responses:
        "302":
          description: Redirect to app with session cookie set

  /api/v1/public/action/oauth/google:
    get:
      tags: [Public]
      summary: Start Google OAuth
      security: []
      responses:
        "302":
          description: Redirect to Google

  /api/v1/public/action/oauth/google/callback:
    get:
      tags: [Public]
      summary: Google OAuth callback
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from Google
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: Must match the state cookie set when the flow started
      responses:
        "302":
          description: Redirect to app with session cookie set

  /api/v1/public/action/oauth/facebook:
    get:
      tags: [Public]
      summary: Start Facebook OAuth
      security: []
      responses:
        "302":
          description: Redirect to Facebook

  /api/v1/public/action/oauth/facebook/callback:
    get:
      tags: [Public]
      summary: Facebook OAuth callback
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from Facebook
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: Must match the state cookie set when the flow started
      responses:
        "302":
          description: Redirect to app with session cookie set

  /api/v1/public/action/stripe/webhook:
    post:
      tags: [Billing]
      summary: Stripe webhook (SaaS edition only)
      security: []
      description: Registered only when the app runs in SaaS mode. Verified with the `Stripe-Signature` header.
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/public/_metrics:
    get:
      tags: [Metrics]
      summary: Prometheus metrics
      security:
        - metricsBasicAuth: []
      responses:
        "200":
          description: Prometheus text exposition format

  /api/v1/me:
    get:
      tags: [Session]
      summary: Current principal
      description: |
        Returns the caller's principal. `X-API-Key` takes precedence over `X-Access-Key`,
        which takes precedence over the session cookie.
      security:
        - sessionCookie: []
        - userApiKey: []
        - workspaceAccessKey: []
      responses:
        "200":
          description: Principal metadata
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MeSession"
                  - $ref: "#/components/schemas/MeAPIKey"
                  - $ref: "#/components/schemas/MeAccessKey"
                discriminator:
                  propertyName: principalType
                  mapping:
                    session: "#/components/schemas/MeSession"
                    api_key: "#/components/schemas/MeAPIKey"
                    access_key: "#/components/schemas/MeAccessKey"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/action/profile:
    get:
      tags: [Profile]
      summary: Get user profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Profile]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ProfileResponse"
                  - $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/action/settings:
    get:
      tags: [Settings]
      summary: Get app settings (admin)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Settings]
      summary: Update app settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/apiKeys:
    post:
      tags: [API keys]
      summary: Create user API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: Created (includes secret once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [API keys]
      summary: List user API keys
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKey"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/apiKeys/{apiKeyId}:
    get:
      tags: [API keys]
      summary: Get user API key
      parameters:
        - $ref: "#/components/parameters/apiKeyId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [API keys]
      summary: Delete user API key
      parameters:
        - $ref: "#/components/parameters/apiKeyId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces:
    post:
      tags: [Workspaces]
      summary: Create workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Workspaces]
      summary: List workspaces for current user
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}:
    get:
      tags: [Workspaces]
      summary: Get workspace
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Workspaces]
      summary: Update workspace
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Workspaces]
      summary: Delete workspace
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/invites:
    post:
      tags: [Invites]
      summary: Create member invite
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Invites]
      summary: List invites
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invite"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/invites/{inviteId}:
    get:
      tags: [Invites]
      summary: Get invite
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/inviteId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Invites]
      summary: Revoke invite
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/inviteId"
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/members:
    get:
      tags: [Members]
      summary: List workspace members
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceMember"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/members/{memberUserId}:
    put:
      tags: [Members]
      summary: Update member role
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/memberUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Members]
      summary: Remove member
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/memberUserId"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/keys:
    post:
      tags: [Access keys]
      summary: Create workspace access key
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessKeyRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Access keys]
      summary: List workspace access keys
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccessKey"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/keys/{keyId}:
    get:
      tags: [Access keys]
      summary: Get access key
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/keyId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Access keys]
      summary: Delete access key
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/keyId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/billing:
    get:
      tags: [Billing]
      summary: Billing status (SaaS only)
      description: Registered only in SaaS mode. Accepts workspace access keys.
      security:
        - sessionCookie: []
        - userApiKey: []
        - workspaceAccessKey: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/billing/usage:
    get:
      tags: [Billing]
      summary: Billing usage (SaaS only)
      description: Registered only in SaaS mode. Accepts workspace access keys.
      security:
        - sessionCookie: []
        - userApiKey: []
        - workspaceAccessKey: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/billing/checkout:
    post:
      tags: [Billing]
      summary: Start Stripe checkout (SaaS only)
      description: Buys AI token credit for the workspace.
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCheckoutRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/billing/portal:
    post:
      tags: [Billing]
      summary: Open Stripe customer portal (SaaS only)
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/kv:
    get:
      tags: [Key-value]
      summary: List workspace keys
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - name: prefix
          in: query
          schema:
            type: string
          description: Return only non-expired keys that start with this text, matched literally (`%` and `_` are not wildcards).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/KeyValueItem"
                  _meta:
                    type: object
                    properties:
                      total:
                        type: integer
                        format: int64
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/kv/{key}:
    get:
      tags: [Key-value]
      summary: Get workspace key
      description: "The {key} path parameter may contain slashes; the server matches the remainder of the path after /kv/."
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/kvKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyValueItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Key-value]
      summary: Write workspace key
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/kvKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutKeyValueRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyValueItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Key-value]
      summary: Delete workspace key
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/kvKey"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"



  /api/v1/workspaces/{workspaceId}/chats:
    get:
      tags: [Chats]
      summary: List the user's chats
      description: |
        The signed-in user's chats with the assistant in this workspace, most recently active first, up to 50.
        Chats are private to the user who started them, so workspace access keys cannot use these routes.
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  chats:
                    type: array
                    items:
                      $ref: "#/components/schemas/Chat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Chats]
      summary: Start a chat
      description: Starts an empty chat. Its title is set from the first message sent to it.
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/chats/{chatId}:
    get:
      tags: [Chats]
      summary: Get a chat with its messages
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/chatId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Chats]
      summary: Delete a chat with its messages
      description: An answer still being written for the chat is dropped.
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/chatId"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/chats/{chatId}/messages:
    post:
      tags: [Chats]
      summary: Ask in a chat and stream the answer
      description: |
        Stores the question, marks the chat `running` and streams the answer as server-sent events. Each event has a
        name and a JSON `data` line:

        - `chat`: the chat with the question stored and status `running`.
        - `delta`: `{"content": "..."}`, the next piece of the answer as it is written, in Markdown.
        - `done`: the chat with the answer stored and status `idle`.
        - `error`: the chat with status `failed` when the answer could not be written.

        The answer is written with the dashboard tools the user may run, under the user's own permissions. It is still
        stored when the client disconnects mid-stream, so a client can read the chat again to get it. Errors found before
        the question is stored come back as JSON with their status code instead of a stream.
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/chatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatMessageRequest"
      responses:
        "200":
          description: A stream of chat, delta, then done or error events
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: chat
                  data: {"id":"...","title":"Which agents do I have?","status":"running","messages":[...]}

                  event: delta
                  data: {"content":"You have **2 agents**"}

                  event: done
                  data: {"id":"...","title":"Which agents do I have?","status":"idle","messages":[...]}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The assistant is still answering the chat's last message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: _blink_session
    userApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    workspaceAccessKey:
      type: apiKey
      in: header
      name: X-Access-Key
    metricsBasicAuth:
      type: http
      scheme: basic
  parameters:
    workspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    apiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    keyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    inviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    memberUserId:
      name: memberUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    chatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    kvKey:
      name: key
      in: path
      required: true
      schema:
        type: string
      description: Key path segment(s) after `/kv/`
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: Validation or bad input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit reached for this client IP; retry after the `Retry-After` header
      headers:
        Retry-After:
          description: Seconds until the window resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Dependency or billing provider not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [errorMessage]
      properties:
        errorMessage:
          type: string

    Status:
      type: object
      properties:
        status:
          type: string
          enum: [ok, not_ok]

    SuccessMessage:
      type: object
      properties:
        successMessage:
          type: string

    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, regular, readonly]
        isActive:
          type: boolean
        isEmailVerified:
          type: boolean
        name:
          type: string
        avatar:
          type: string
          format: uri
        language:
          type: string
          enum: [en, fr]
        theme:
          type: string
          enum: [default, blue, slate, emerald, dark]
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProfileResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/Profile"

    Settings:
      type: object
      description: Values are stored as strings.
      properties:
        platform_email:
          type: string
        maintenance_mode:
          type: string
          example: "false"

    PaginationMeta:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          format: int64

    SetupRequest:
      type: object
      required: [platformEmail]
      properties:
        platformEmail:
          type: string
          format: email
          minLength: 4
          maxLength: 60

    UpdateProfileRequest:
      type: object
      required: [language, theme]
      properties:
        name:
          type: string
          maxLength: 255
        language:
          type: string
          enum: [en, fr]
        theme:
          type: string
          enum: [default, blue, slate, emerald, dark]

    UpdateSettingsRequest:
      type: object
      required: [platformEmail]
      properties:
        platformEmail:
          type: string
          format: email
          maxLength: 255
        maintenanceMode:
          type: boolean

    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        expiresAt:
          type: string
          format: date-time
          maxLength: 64

    APIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
          description: Returned only on create
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MeUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string

    MeSession:
      type: object
      properties:
        principalType:
          type: string
          example: session
        user:
          $ref: "#/components/schemas/MeUser"

    MeAPIKey:
      type: object
      properties:
        principalType:
          type: string
          example: api_key
        owner:
          $ref: "#/components/schemas/MeUser"
        apiKey:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            expiresAt:
              type: string
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    MeAccessKey:
      type: object
      properties:
        principalType:
          type: string
          example: access_key
        accessKey:
          $ref: "#/components/schemas/AccessKey"

    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 60

    UpdateWorkspaceRequest:
      $ref: "#/components/schemas/CreateWorkspaceRequest"

    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        handle:
          type: string
        count:
          type: integer
          format: int64
        role:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateInviteRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          minLength: 4
          maxLength: 255
        role:
          $ref: "#/components/schemas/WorkspaceRole"

    WorkspaceRole:
      type: string
      enum: [admin, regular, readonly]

    Invite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        token:
          type: string
          description: Returned only on create
        status:
          type: string
        inviterUserId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/WorkspaceRole"

    WorkspaceMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAccessKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 60
        expiresAt:
          type: string
          format: date-time
          maxLength: 64
        permissions:
          type: array
          items:
            type: string

    AccessKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        key:
          type: string
          description: Returned only on create
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BillingStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        providerCustomerId:
          type: string
        aiTokensBalance:
          type: integer
          format: int64
        tokensPerUsd:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BillingUsage:
      type: object
      properties:
        periodReset:
          type: string
          format: date-time
        used:
          type: object
          properties:
            workspaceMembers:
              type: integer
              format: int64
            aiTokens:
              type: integer
              format: int64
            aiCost:
              type: number
        limits:
          type: object
          properties:
            workspaceMembers:
              type: integer
              format: int64
            aiTokens:
              type: integer
              format: int64

    BillingCheckoutRequest:
      type: object
      required: [amountCents]
      properties:
        amountCents:
          type: integer
          format: int64
          minimum: 100

    BillingSession:
      type: object
      properties:
        url:
          type: string
          format: uri

    PutKeyValueRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
        expiresAt:
          type: string
          format: date-time
          maxLength: 64

    KeyValueItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        key:
          type: string
        value:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Chat:
      type: object
      description: A chat between the user and the dashboard assistant.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: The first 60 characters of the first question; empty until one is sent.
        status:
          type: string
          enum: [idle, running, failed]
          description: "`running` while an answer is being written, `failed` when the last answer could not be written."
        preview:
          type: string
          description: The chat's last message. Only in the chat list.
        messages:
          type: array
          description: The chat's questions and answers, oldest first. Only when reading one chat, and absent while it has none.
          items:
            $ref: "#/components/schemas/ChatMessage"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [user, assistant]
        content:
          type: string
          description: The question as sent, or the answer in Markdown.
        createdAt:
          type: string
          format: date-time
    SendChatMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 4000
